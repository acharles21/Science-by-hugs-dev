<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay with PayPal — Science by HUGs</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "SF Pro Text", Arial, sans-serif;
      background: #0b0b0d;
      color: #f5f5f7;
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 20px 50px;
    }

    .back {
      display: inline-block;
      color: #a9a9b0;
      text-decoration: none;
      font-size: 15px;
      margin-bottom: 28px;
    }

    .brand {
      text-align: center;
      margin-bottom: 34px;
    }

    .brand h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: -0.8px;
    }

    .brand p {
      margin: 8px 0 0;
      color: #a9a9b0;
      font-size: 16px;
    }

    .payment-card {
      background: #151518;
      border: 1px solid #29292e;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 16px;
      text-align: center;
    }

    .payment-card h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .payment-card p {
      margin: 0 0 24px;
      color: #a9a9b0;
      font-size: 14px;
      line-height: 1.5;
    }

    .paypal-button {
      display: flex;
      justify-content: center;
    }

    .paypal-button form {
      display: inline-grid;
      justify-items: center;
      align-content: start;
      gap: 0.5rem;
    }

    .paypal-button input {
      text-align: center;
      border: none;
      border-radius: 0.25rem;
      min-width: 11.625rem;
      padding: 0 2rem;
      height: 2.625rem;
      font-weight: bold;
      background-color: #FFD140;
      color: #000000;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.25rem;
      cursor: pointer;
    }

    .paypal-button img {
      max-width: 180px;
    }

    .paypal-button .wordmark {
      height: 0.875rem;
      vertical-align: middle;
    }
  </style>
</head>

<body>

  <main class="page">

    <a class="back" href="./pay.html">
      ‹ Back to Payment Options
    </a>

    <div class="brand">
      <h1>Science by HUGs</h1>
      <p>Pay securely with PayPal.</p>
    </div>

    <section class="payment-card">

      <h2>Pay with PayPal</h2>

      <p>
        Click below to continue securely to PayPal.
      </p>

      <div class="paypal-button">

        <form
          action="https://www.paypal.com/ncp/payment/99BF96EKFWSPA"
          method="post"
          target="_blank"
        >

          <input
            type="submit"
            value="Pay Now"
          />

          <img
            src="https://www.paypalobjects.com/images/Debit_Credit_APM.svg"
            alt="Cards accepted"
          >

          <section style="font-size:0.75rem;">
            Powered by
            <img
              class="wordmark"
              src="https://www.paypalobjects.com/paypal-ui/logos/svg/paypal-wordmark-color.svg"
              alt="PayPal"
            >
          </section>

        </form>

      </div>

    </section>

  </main>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").then(registration => {
    registration.update();
  });
}
</script>
  
</body>
</html>
